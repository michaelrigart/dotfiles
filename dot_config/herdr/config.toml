# Herdr configuration — managed by chezmoi
# (source: dot_config/herdr/config.toml → ~/.config/herdr/config.toml)
#
# Only deliberate divergences from `herdr --default-config` live here. Anything
# omitted follows the shipped default, so an upstream default change surfaces as a
# behaviour change rather than being silently pinned.
#
# Keybinding model:
#   Ctrl-h/j/k/l  → seamless Neovim splits + Herdr panes (smart-splits.nvim)
#   Alt + <key>   → tabs, zoom, panes, detach
# Alt rather than digits because digits need Shift on AZERTY. Ghostty is configured
# `macos-option-as-alt = left`, so this works from the LEFT Option key only.

# First run otherwise shows onboarding and may write back to this file, which chezmoi
# owns — the write would surface as drift and be reverted on the next apply.
onboarding = false

[theme]
name = "tokyo-night"

# Tokyo Night tokens. The rail sits a step under Ghostty's #1a1b26 as a recessed surface
# and the active row lifts the same distance; the accent is Starship's prompt blue.
[theme.custom]
sidebar_bg = "#16161e"
active_row_bg = "#292e42"
selection_bg = "#283457"
accent = "#7aa2f7"
# The status colours are the prompt's own red and green for failed and successful commands.
red = "#f7768e"
green = "#9ece6a"

# The shipped default is `delivery = "off"`, and then `herdr notification show` does
# nothing, which removes the only feedback channel a detached `[[keys.command]]` has: a
# failed tab jump would look like a dead keybinding.
#
# "herdr" = in-app toasts, which need no OS permission. Both signals Herdr has (this and
# `[ui.sound]`) are scoped to background activity, so nothing reaches me in another
# application. Accepted: the sidebar still carries the state.
#
# The sidebar borrows the prompt's palette: #7aa2f7 marks the space you are in and
# #7dcfff the branch. Nothing else is coloured, which keeps them legible.
[ui]
# Keep the sidebar grouped by workspace rather than a flat agent list.
agent_panel_sort = "spaces"
# Three numbers, because the width auto-scales to the workspace names and only the floor
# binds when they are short.
#
# Paired with hl_shorten's budget in layout.sh, which sits below this: indentation, the
# state glyph and a scrollbar take columns. Move them together, or Herdr truncates the
# end of a slug, which is the half that identifies it.
sidebar_width = 40
sidebar_min_width = 36
sidebar_max_width = 44
# Shape, not just colour: a glyph is scannable in peripheral vision.
status_indicators = "symbols"
# Alt-q closes only the current workspace: one Herdr session owns many projects, so
# keep Herdr's confirmation rather than killing every repository in the server.
confirm_close = true

[ui.toast]
delivery = "herdr"

# Two rows per space: which checkout, then which branch. The branch is the longest string
# in the rail and the one worth reading unabbreviated.
[ui.sidebar.spaces]
row_gap = 1
# The phase marker leads row 2 so it survives truncation. Three tokens with exactly one
# set buys a colour per phase: an inline style is fixed per token.
# Reported by ~/.config/herdr/phase.sh; see the dev.phase plugin for when it runs.
rows = [
  ["state_icon", { token = "workspace", bold = true }, { token = "git_status", dim = true }],
  [{ token = "$active", fg = "#9ece6a", bold = true },
   { token = "$review", fg = "#e0af68", bold = true },
   { token = "$merged", fg = "#565f89" },
   { token = "branch",  fg = "#7dcfff" }],
]

# `workspace` is deliberately absent: agent_panel_sort = "spaces" already groups these
# under their space.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", bold = true }],
  [{ token = "terminal_title_stripped", dim = true }],
]

# Codex titles its pane after the repository, which restates the heading; Claude titles
# it after the conversation, which says what it is doing, so it keeps both rows.
[ui.sidebar.agents.rows_by_agent]
codex = [["state_icon", { token = "agent", bold = true }]]

[session]
# What the Claude/Codex integrations exist to serve; the shipped default, pinned.
resume_agents_on_restore = true

[keys]
# Kept as an escape hatch. Herdr's prefix does not shadow shell readline or Neovim
# keys, so nothing needs clearing.
prefix = "ctrl+b"

zoom = "alt+z"
split_vertical = "alt+n"
new_tab = "alt+t"
detach = "alt+w"
toggle_sidebar = "alt+b"
close_workspace = "alt+q"
edit_scrollback = "alt+s"

# Ghostty maps Cmd-k to Alt-k. clear_pane keeps the prompt line and leaves full-screen
# apps alone; passing Alt-k through to zsh's clear-screen stopped working in 0.9.
clear_pane = "alt+k"

# Herdr's built-in creator cannot run .worktreeinclude/.worktreehook or install the
# ownership lock that keeps native removal behind wt-rm. Its default shortcut is
# replaced below by a popup calling the safe wt flow; native open/grouping still
# belongs to Herdr after Git creation.
new_worktree = ""

# smart-splits.nvim owns the dispatch. In Neovim it moves between editor splits and
# calls Herdr at the edge; outside Neovim its bundled Herdr plugin moves pane focus,
# while preserving shell Ctrl-h/Ctrl-l when no neighbor exists. Linking the plugin is
# part of the live activation gate.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "exec \"${SHELL:-zsh}\" -ic wt-prompt"
description = "new worktree (safe wt flow)"
width = "60%"
height = 7

# The on-demand `bin/rails console` slot, layered over the tab layout while visible.
[[keys.command]]
key = "alt+p"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch shell"
width = "80%"
height = "80%"

# lazygit on demand rather than a permanent tab: a popup keeps the one-key reach and
# leaves no tab behind to close for being in the way.
[[keys.command]]
key = "alt+g"
type = "popup"
command = "exec lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# Tab jumps. `switch_tab` is range-only and tab.focus takes a tab_id, so these resolve
# by LABEL, which also survives tabs being appended out of order.
[[keys.command]]
key = "alt+a"
type = "shell"
command = "~/.config/herdr/tab-goto.sh agents"
description = "tab: agents"

# --create, because the editor tab is lazy: alt+e is the only thing that brings it into
# existence. The eager jumps deliberately do NOT create: layout.sh re-adds a missing
# agents or runtime tab, and a jump that built one would hide the fault.
[[keys.command]]
key = "alt+e"
type = "shell"
command = "~/.config/herdr/tab-goto.sh --create editor"
description = "tab: editor"

[[keys.command]]
key = "alt+r"
type = "shell"
command = "~/.config/herdr/tab-goto.sh runtime"
description = "tab: runtime"

# Forced refresh: bypasses the MR-state TTL, for right after merging in the browser.
[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "~/.config/herdr/phase.sh refresh --force"
description = "refresh space phases"
