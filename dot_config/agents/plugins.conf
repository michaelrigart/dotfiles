# AI agent marketplaces + plugins, reconciled by .scripts/reconcile-agents.sh.
#
# Format: <kind>  <value>  [<dir>]   (# comments and blank lines ignored)
# Kinds:  claude_marketplace | claude_plugin | claude_mcp | codex_marketplace | codex_plugin
#
# claude_mcp <name> [<dir>] registers a stdio MCP server in Claude Code's user scope. The
# command is the launcher $HOME/.local/bin/<name>, which holds its own credentials;
# a differing existing entry is replaced. With <dir> (~, ~/<path> or absolute) the server
# goes in local scope for that directory only, and its user-scope entry is removed. <dir>
# must be outside any git repository (Claude Code keys local scope by the repository
# root there, so the server would run repo-wide); such a line is skipped with a warning.
# One directory per server: a second line for the same name with a different directory is
# skipped, and the first line wins. <dir> is the only third field, and only on claude_mcp.
#
# claude-plugins-official is Claude Code's built-in default marketplace — deliberately
# NOT declared here; the *-official plugins below resolve against it.

claude_marketplace  basecamp/claude-plugins
# Repo name and marketplace name differ: sirkirby/unifi-mcp publishes the
# marketplace "unifi-plugins", which is what the plugin id below resolves against.
claude_marketplace  sirkirby/unifi-mcp

claude_plugin       basecamp@37signals
claude_plugin       claude-code-setup@claude-plugins-official
claude_plugin       claude-md-management@claude-plugins-official
claude_plugin       frontend-design@claude-plugins-official
claude_plugin       ruby-lsp@claude-plugins-official
claude_plugin       superpowers@claude-plugins-official
claude_plugin       unifi-network@unifi-plugins

# ha-mcp is not declared here: ~/Code/home-assistant/.mcp.json starts it in that repo only.

codex_marketplace   addyosmani/agent-skills

codex_plugin        agent-skills@agent-skills
