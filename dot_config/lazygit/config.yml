# lazygit — managed by chezmoi (dot_config/lazygit/config.yml → ~/.config/lazygit/config.yml).
# XDG_CONFIG_HOME is set, so lazygit reads this path (not ~/Library/Application Support).
#
# Route lazygit's diffs through delta (unified — lazygit's panel is narrow; --paging=never
# because lazygit does its own scrolling). Picks up [delta] settings from ~/.config/git/config.
#
# NOTE: this key has been renamed twice. The `git.paging` map became `git.pagers` (a list)
# in 0.63, which became `git.diffRenderers` with a `command` field in 0.64. lazygit migrates
# the old spelling on start and rewrites the file, so tracking a superseded name here means
# chezmoi and lazygit overwrite each other on every apply. Match the installed version
# (currently 0.64.1); re-check this after a lazygit major bump.
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
