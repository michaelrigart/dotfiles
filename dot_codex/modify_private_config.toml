{{- /* chezmoi:modify-template */ -}}
{{- /* Manage ~/.codex/config.toml declaratively.                             */ -}}
{{- /* Parse the live file so Codex-managed state is preserved, then:         */ -}}
{{- /*   - seed model/effort/tier prefs ONLY when absent (so /model and       */ -}}
{{- /*     fast-mode changes persist),                                        */ -}}
{{- /*   - enforce UI / keybindings / notify / prevent_idle_sleep,            */ -}}
{{- /*   - keep js_repl explicitly off.                                       */ -}}
{{- /* NB: TOML comments and key ordering are not preserved (parse→serialize).*/ -}}
{{- $config := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}

{{- /* Seed model preferences only when absent */ -}}
{{- if not (hasKey $config "model") -}}
{{-   $config = setValueAtPath "model" "gpt-5.6-sol" $config -}}
{{- end -}}
{{- if not (hasKey $config "model_reasoning_effort") -}}
{{-   $config = setValueAtPath "model_reasoning_effort" "high" $config -}}
{{- end -}}
{{- if not (hasKey $config "service_tier") -}}
{{-   $config = setValueAtPath "service_tier" "fast" $config -}}
{{- end -}}
{{- if not (hasKey $config "plan_mode_reasoning_effort") -}}
{{-   $config = setValueAtPath "plan_mode_reasoning_effort" "xhigh" $config -}}
{{- end -}}

{{- /* Enforce project instruction discovery */ -}}
{{- $config = setValueAtPath "project_doc_fallback_filenames" (list "CLAUDE.md") $config -}}
{{- $config = setValueAtPath "project_doc_max_bytes" 65536 $config -}}

{{- /* Enforce the notify hook (path derived from home dir, not hardcoded) */ -}}
{{- $notify := list (printf "%s/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient" .chezmoi.homeDir) "turn-ended" -}}
{{- $config = setValueAtPath "notify" $notify $config -}}

{{- /* Enforce TUI appearance and behavior */ -}}
{{- $config = setValueAtPath "tui.theme" "tokyo-night" $config -}}
{{- $config = setValueAtPath "tui.status_line" (list "current-dir" "git-branch" "model-with-reasoning" "fast-mode" "context-remaining") $config -}}
{{- $config = setValueAtPath "tui.notifications" (list "approval-requested") $config -}}
{{- $config = setValueAtPath "tui.notification_condition" "unfocused" $config -}}
{{- $config = setValueAtPath "tui.keymap.global.open_transcript" "ctrl-t" $config -}}
{{- $config = setValueAtPath "tui.keymap.chat.interrupt_turn" "f12" $config -}}
{{- /* Every TUI puts its thread id FIRST in its terminal title: the title is the join
       between a herdr pane and its Codex thread, for the pane-map hook and for xreview.
       Codex truncates long titles, so anything after the id may be cut but the id is not.
       Set here, never with -c: any -c override makes a TUI leave the shared daemon. */ -}}
{{- $config = setValueAtPath "tui.terminal_title" (list "thread-id" "thread-title" "current-dir") $config -}}

{{- /* Enforce feature flags. js_repl is NOT obsolete — 0.149.1 still ships it as a
       live flag (alongside code_mode_only / js_repl_tools_only) plus js_repl_node_path
       and js_repl_node_module_dirs. It is off by default today, so unsetting it looked
       harmless, but that also guaranteed an explicit guard could never persist: one
       upstream default flip and Codex gets a JS REPL silently. Pin it off instead. */ -}}
{{- $config = setValueAtPath "features.memories" true $config -}}
{{- $config = setValueAtPath "features.prevent_idle_sleep" true $config -}}
{{- /* Required by the Herdr codex integration: its hook only fires with this set.
       Pinned HERE rather than left to `herdr integration install`, because that
       installer and this template would otherwise fight on every apply — and
       because `herdr integration uninstall` deliberately leaves the flag set, so
       rollback has to clear it explicitly by deleting this line.                 */ -}}
{{- $config = setValueAtPath "features.hooks" true $config -}}
{{- /* daemon_auto_start stays off: a daemon (0.157+) spawned by whichever TUI happened
       to start it first keeps that pane's environment, and the Herdr hook running
       inside it then reports every new thread against that one pane's HERDR_PANE_ID,
       leaving every other Codex pane without a session id. launchd starts the shared
       daemon instead, with no HERDR_* in its environment (`codex-daemon`, spec
       section 5), and every interactive `codex` attaches to it through the
       `~/.local/bin/codex` launcher rather than spawning its own. xreview no longer
       has a no-daemon path (`codex queue`, its pre-0.157 route): it dispatches through
       the shared daemon via `xreview-rpc` (spec section 7.1). A daemon that is already
       running keeps serving until `codex app-server daemon stop`, or
       `codex-daemon restart`.                                                  */ -}}
{{- $config = setValueAtPath "features.daemon_auto_start" false $config -}}
{{- $config = setValueAtPath "features.js_repl" false $config -}}

{{- $config | toToml -}}
