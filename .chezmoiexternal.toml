# Bumping a pinned skill:
# 1. A bump reads the upstream diff first and runs `agent-text-scan --diff` on it: an `invisible` finding stops the bump until Michael has seen it, and any other finding that matters goes in the commit message.
# 2. It then changes the SHA and its tag comment.
# 3. Then it warms chezmoi's cache outside the sandbox (`command chezmoi --source <checkout> managed >/dev/null`: sandboxed, Go's TLS fails).
# 4. Confirm afterwards that `command chezmoi --source <checkout> managed` lists `.agents/skills/<name>/SKILL.md`, and that `.scripts/skill-updates.sh` prints `current: <name> <tag>` (a SHA that exists only in a fork still downloads).
# 5. The commit message carries `Closes #<issue>`.

[".agents/skills/clarity"]
    type = "archive"
    # v0.2.1
    url = "https://github.com/addyosmani/clarity/archive/e27ceeff60368cf6966b4ea00a5b9b36418ee9a0.tar.gz"
    exact = true
    stripComponents = 1
    include = ["*/SKILL.md", "*/LICENSE", "*/references", "*/references/**", "*/scripts", "*/scripts/**"]
