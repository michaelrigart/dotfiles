# Known machines. Adding one here is the first half of provisioning it; the second is
# a conditional in dot_config/homebrew/Brewfile.tmpl, and only if it diverges.
#
# .scripts/provision.sh refuses an unlisted name at preflight, and Brewfile.tmpl fails
# the render for an unlisted machine — without that second check an unknown machine
# would silently take the else branch and quietly install the wrong package set.
known_hostnames = ["fenrir", "hercules"]
